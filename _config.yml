# Book settings
title: "Apuntes de sensores inteligentes."
author: "Daan Yael Maldonado Uriostigue and Roberto Giovanni Ramírez Chavarría "
copyright: "2024"
logo: logo.png  # Tu logotipo, que también se mostrará en la barra de navegación

# Configuración para notebooks
execute:
  execute_notebooks: force  # Ejecuta notebooks en cada compilación
  timeout: 120  # Timeout de 120 segundos para celdas con animaciones

# Definición para salida en formato LaTeX y PDF
latex:
  latex_documents:
    targetname: book.tex

# Configuración para citas con archivos BibTeX
bibtex_bibfiles:
  - references.bib

# Opciones para botones de GitHub y enlaces
repository:
  url: https://github.com/DaanMaldonadoU/DaanMaldonadoU.github.io
  path_to_book: ''
  branch: main

# Habilitar botones de GitHub
html:
  use_issues_button: true
  use_repository_button: true
  extra_footer: |
    <p>Recurso académico realizado gracias al apoyo del proyecto UNAM-DGAPA-PAPIME PE101524.</p>
    <hr style="margin:10px 0;">
    <p style="font-size:0.85em;">
      "Apuntes de Sensores Inteligentes" &copy; 2025
      por D. Y. Maldonado Uriostigue y R. G. Ramírez Chavarría,
      Universidad Nacional Autónoma de México, Avenida Universidad 3000, Ciudad Universitaria, Coyoacán, 04510, Ciudad de México.<br>
      Esta obra está bajo una licencia
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">Creative Commons Atribución/Reconocimiento-NoComercial-CompartirIgual 4.0 Internacional</a>.<br>
      <strong>Última Actualización: 2025.</strong>
    </p>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        document.documentElement.removeAttribute("data-theme");
        document.documentElement.setAttribute("data-theme", "light");
        var tocNav = document.getElementById("pst-page-toc-nav");
        if (tocNav) { tocNav.classList.add("bd-toc-nav"); }
        /* Accesibilidad: alt text para animaciones */
        document.querySelectorAll('img[id^="_anim_img"]').forEach(function(img) {
          if (!img.getAttribute('alt')) img.setAttribute('alt', 'Animación interactiva');
        });
        /* Accesibilidad: labels para sliders de animación */
        document.querySelectorAll('input.anim-slider').forEach(function(slider) {
          if (!slider.getAttribute('aria-label')) slider.setAttribute('aria-label', 'Control de animación');
        });
        /* Accesibilidad: label para barra de búsqueda */
        var searchInput = document.querySelector('input[name="q"][type="search"]');
        if (searchInput && !searchInput.getAttribute('aria-label')) {
          searchInput.setAttribute('aria-label', 'Buscar en este libro');
        }
      });
      window.addEventListener("load", function() {
        function refreshScrollSpy() {
          if (typeof bootstrap !== 'undefined' && bootstrap.ScrollSpy) {
            var spy = bootstrap.ScrollSpy.getInstance(document.body);
            if (spy) {
              spy.refresh();
            } else {
              var target = document.querySelector('.bd-toc-nav');
              if (target) {
                new bootstrap.ScrollSpy(document.body, {
                  target: '.bd-toc-nav',
                  rootMargin: '0px 0px -60%',
                  threshold: [0.1, 0.5, 1]
                });
              }
            }
          }
        }
        setTimeout(refreshScrollSpy, 500);
        setTimeout(refreshScrollSpy, 2000);
      });
    </script>

# Habilitar widgets interactivos y Thebe
jupyter:
  thebe: true
  widgets: enabled

# Opciones de lanzamiento y botones de ejecución interactiva
launch_buttons:
  binderhub_url: https://mybinder.org
  thebe: true
  repository_url: https://github.com/DaanMaldonadoU/DaanMaldonadoU.github.io

sphinx:
  config:
    language: es
    html_static_path: ['_static']
    html_css_files:
      - estilo.css

parse:
  myst_enable_extensions: ["dollarmath"]